<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Terraform AWS three-tier architecture</title>
  <desc id="desc">Terraform uses S3 state and creates an ALB, private EC2 tier, isolated RDS tier, IAM and CloudWatch.</desc>
  <defs><style>.t{font:700 22px Arial;fill:#172033}.s{font:16px Arial;fill:#172033}.b{fill:#f7f9fc;stroke:#5271ff;stroke-width:3}.a{stroke:#374151;stroke-width:3;marker-end:url(#m)}.z{fill:#eef4ff;stroke:#8aa4ff;stroke-width:2}</style><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#374151"/></marker></defs>
  <rect width="1200" height="680" fill="#fff"/><text x="600" y="40" text-anchor="middle" class="t">Terraform AWS Foundations — production-style lab</text>
  <rect x="35" y="90" width="180" height="80" rx="16" class="b"/><text x="125" y="125" text-anchor="middle" class="t">Terraform</text><text x="125" y="151" text-anchor="middle" class="s">root module</text>
  <rect x="35" y="230" width="180" height="80" rx="16" class="b"/><text x="125" y="265" text-anchor="middle" class="t">S3 state</text><text x="125" y="291" text-anchor="middle" class="s">encrypted + locked</text>
  <line x1="125" y1="170" x2="125" y2="226" class="a"/>
  <rect x="280" y="80" width="875" height="550" rx="24" fill="#f8fbff" stroke="#263b80" stroke-width="4"/><text x="310" y="120" class="t">VPC 10.30.0.0/16 — two Availability Zones</text>
  <rect x="320" y="150" width="795" height="120" rx="18" class="z"/><text x="345" y="183" class="t">Public tier</text><rect x="520" y="174" width="220" height="70" rx="14" class="b"/><text x="630" y="216" text-anchor="middle" class="t">ALB</text><rect x="825" y="174" width="220" height="70" rx="14" class="b"/><text x="935" y="205" text-anchor="middle" class="t">NAT Gateway</text><text x="935" y="229" text-anchor="middle" class="s">outbound only</text>
  <rect x="320" y="300" width="795" height="120" rx="18" class="z"/><text x="345" y="333" class="t">Private application tier</text><rect x="520" y="330" width="220" height="65" rx="14" class="b"/><text x="630" y="370" text-anchor="middle" class="t">EC2 + Nginx ×2</text><rect x="825" y="330" width="220" height="65" rx="14" class="b"/><text x="935" y="358" text-anchor="middle" class="t">IAM + SSM</text><text x="935" y="382" text-anchor="middle" class="s">no SSH</text>
  <rect x="320" y="450" width="795" height="120" rx="18" class="z"/><text x="345" y="483" class="t">Isolated database tier</text><rect x="520" y="480" width="220" height="65" rx="14" class="b"/><text x="630" y="509" text-anchor="middle" class="t">PostgreSQL RDS</text><text x="630" y="533" text-anchor="middle" class="s">encrypted, private</text><rect x="825" y="480" width="220" height="65" rx="14" class="b"/><text x="935" y="509" text-anchor="middle" class="t">Secrets Manager</text><text x="935" y="533" text-anchor="middle" class="s">managed password</text>
  <line x1="215" y1="130" x2="515" y2="205" class="a"/><line x1="630" y1="244" x2="630" y2="326" class="a"/><line x1="630" y1="395" x2="630" y2="476" class="a"/><line x1="740" y1="362" x2="820" y2="362" class="a"/><line x1="740" y1="512" x2="820" y2="512" class="a"/>
  <text x="600" y="660" text-anchor="middle" class="s">Browser → ALB → private EC2 → private RDS | CloudWatch monitors EC2</text>
</svg>
